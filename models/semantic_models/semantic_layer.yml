version: 2

models:
  - name: metricflow_time_spine
    config:
      meta:
        metricflow_time_spine: true

semantic_models:
  - name: enrollment_star
    model: ref('fct_enrollments')
    defaults:
      agg_time_dimension: enrollment_date
    entities:
      - name: student
        type: primary  # Only ONE can be primary
        expr: student_id
      - name: course
        type: unique   # Changed from primary to unique
        expr: course_id
    dimensions:
      - name: enrollment_date
        type: time
        type_params:
          time_granularity: day
      - name: current_major
        type: categorical
      - name: course_category
        type: categorical
    measures:
      - name: total_credits
        agg: sum
        expr: credits
      - name: student_count
        agg: count_distinct
        expr: student_id

metrics:
  # 1. SIMPLE METRICS (Define these first so others can use them)
  - name: university_credit_load
    label: "Total Credits"
    type: simple
    type_params:
      measure: total_credits

  - name: student_headcount
    label: "Unique Students"
    type: simple
    type_params:
      measure: student_count

  # 2. RATIO METRIC (Now referencing the METRIC names above)
  - name: credits_per_student_ratio
    label: "Complexity: Ratio Calculation"
    type: ratio
    type_params:
      numerator: university_credit_load    # Changed from total_credits
      denominator: student_headcount      # Changed from student_count

  # 3. FILTERED METRIC
  - name: stem_student_credits
    label: "Complexity: Filtered Metric"
    type: simple
    type_params:
      measure: total_credits
    filter: |
      {{ Dimension('student__current_major') }} IN ('Computer Science', 'Engineering', 'Mathematics')

  # 4. DERIVED METRIC
  - name: avg_credits_per_student
    label: "Avg Credits per Student"
    type: derived
    type_params:
      expr: university_credit_load / student_headcount
      metrics:
        - name: university_credit_load
        - name: student_headcount